<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        background: #12201c;
        color: #e8f5f1;
        font: 14px system-ui, sans-serif;
      }
      header { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; }
      h1 { font-size: 15px; font-weight: 500; margin: 0; }
      #never {
        margin: 0; padding: 3px; background: transparent; border-radius: 6px; line-height: 0;
        opacity: .45; border: 1px solid transparent;
      }
      #never:hover { opacity: .8; }
      #never.on { opacity: 1; border-color: #e53935; background: #2a1414; }
      #never img { width: 20px; height: 20px; }
      .entry {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        border-radius: 8px;
        background: #1b2a26;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .entry:hover { background: #24382f; }
      .site {
        flex: none; width: 28px; height: 28px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; overflow: hidden;
      }
      .site img { width: 24px; height: 24px; }
      .site.letter { background: #2c4740; color: #9fe1cb; font-weight: 600; font-size: 13px; }
      .entry .title { font-weight: 500; }
      .entry .user { font-size: 12px; color: #9fe1cb; }
      .entry.pending { border: 1px solid #f29a2e; }
      .entry.pending .title { color: #f29a2e; }
      .entry .note { font-size: 11px; color: #f29a2e; margin-top: 2px; }
      .review { margin-left: auto; display: flex; gap: 6px; }
      .review button { margin: 0; padding: 4px 9px; font-size: 14px; line-height: 1; }
      .review .no { background: transparent; color: #f29a2e; border: 1px solid #f29a2e; }
      .entry.failed { border: 1px solid #e53935; }
      .entry.failed .title, .entry.failed .note { color: #ff6f6b; }
      .entry.failed .review .yes { background: transparent; color: #e8f5f1; border: 1px solid #2c4740; }
      .entry.failed .review .no { color: #ff6f6b; border-color: #e53935; }
      .switch { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 0 10px; font-size: 12px; color: #8aa79f; cursor: pointer; }
      .switch input { width: auto; margin: 0; accent-color: #1fcfb4; cursor: pointer; }
      .pencil {
        margin: 0 0 0 6px; padding: 2px 8px; background: transparent; color: #8aa79f;
        border: 1px solid #2c4740; font-size: 14px; line-height: 1.4;
      }
      .pencil:hover { color: #e8f5f1; border-color: #1fcfb4; }
      .entry > div:nth-of-type(2) { flex: 1; min-width: 0; }
      .badge.duplicate { background: #2c4740; color: #9fb8b0; }
      .badge {
        margin-left: auto;
        font-size: 11px;
        color: #0c1714;
        background: #1fcfb4;
        border-radius: 4px;
        padding: 2px 6px;
      }
      .muted { color: #8aa79f; font-size: 13px; line-height: 1.5; }
      .tools { display: flex; align-items: center; gap: 4px; }
      #menu {
        margin: 0; padding: 2px 9px; background: transparent; color: #8aa79f; font-size: 18px; line-height: 1;
        border: 1px solid transparent; border-radius: 6px;
      }
      #menu:hover, #menu.open { color: #e8f5f1; border-color: #2c4740; }
      #menu-panel { background: #1b2a26; border-radius: 8px; padding: 8px; margin: 0 0 10px; }
      #menu-panel .state { font-size: 12px; color: #9fe1cb; padding: 2px 6px 6px; line-height: 1.4; }
      #menu-panel .item {
        display: block; width: 100%; text-align: left; margin: 0; padding: 7px 6px;
        background: transparent; color: #e8f5f1; font-weight: 400; border-radius: 6px;
      }
      #menu-panel .item:hover { background: #24382f; }
      #menu-panel .switch { margin: 2px 0 0; padding: 6px; }
      .small { font-size: 12px; }
      .with-eye { position: relative; }
      .with-eye input { padding-right: 40px; }
      .eye {
        position: absolute; right: 4px; top: 50%; transform: translateY(-50%); margin: 0; padding: 4px 6px;
        background: transparent; color: #8aa79f; font-size: 14px;
      }
      .eye:hover { color: #e8f5f1; }
      input::-ms-reveal { display: none; }
      .link { display: block; margin-top: 10px; color: #8aa79f; font-size: 12px; }
      input {
        width: 100%;
        box-sizing: border-box;
        background: #0c1714;
        border: 1px solid #2c4740;
        color: #e8f5f1;
        border-radius: 6px;
        padding: 8px;
        font: 13px monospace;
      }
      button {
        margin-top: 8px;
        background: #1fcfb4;
        color: #0c1714;
        border: 0;
        border-radius: 6px;
        padding: 8px 12px;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Keyhold</h1>
      <div class="tools">
        <button id="never" hidden><img src="icons/stop32.png" alt="" /></button>
        <button id="menu">⋮</button>
      </div>
    </header>
    <div id="menu-panel" hidden></div>
    <div id="content" class="muted">Looking for matches…</div>
    <script src="popup.js"></script>
  </body>
</html>
